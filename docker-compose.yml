services:
  db:
    image: postgres:15-alpine
    container_name: cadence-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cadence
      POSTGRES_PASSWORD: cadence_local_dev
      POSTGRES_DB: cadence
    ports:
      # 5433 on the host so this does not collide with a local PostgreSQL install
      - '5433:5432'
    volumes:
      - cadence_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cadence -d cadence']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cadence_pgdata:
